# ──────────────────────────────────────────────────────────────
# 🤖 yt-dlp Auto-Updater Bot
# Runs daily at 06:00 UTC. Checks PyPI for the latest yt-dlp
# release and opens a PR if a newer version is available.
# ──────────────────────────────────────────────────────────────

name: "🔄 yt-dlp Auto-Updater"

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check latest yt-dlp version
        id: version_check
        run: |
          LATEST=$(curl -sf https://pypi.org/pypi/yt-dlp/json | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              const info = JSON.parse(d);
              console.log(info.info.version);
            });
          ")
          
          if [ -f .yt-dlp-version ]; then
            CURRENT=$(cat .yt-dlp-version | tr -d '[:space:]')
          else
            CURRENT="none"
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "📦 Latest yt-dlp: $LATEST"
          echo "📌 Current pin:   $CURRENT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "$LATEST" > .yt-dlp-version
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.version_check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): bump yt-dlp to ${{ steps.version_check.outputs.latest }}"
          title: "⬆️ Bump yt-dlp to ${{ steps.version_check.outputs.latest }}"
          body: |
            ## 🤖 Automated yt-dlp Update

            | | Version |
            |---|---|
            | **Current** | `${{ steps.version_check.outputs.current }}` |
            | **Latest**  | `${{ steps.version_check.outputs.latest }}` |

            ### Why?
            Video platforms frequently change their extraction APIs. Keeping `yt-dlp` updated ensures VideoFetch continues to work reliably.

            📋 [yt-dlp ${{ steps.version_check.outputs.latest }} Release Notes](https://github.com/yt-dlp/yt-dlp/releases/tag/${{ steps.version_check.outputs.latest }})

            ---
            *🤖 Auto-generated by the yt-dlp Auto-Updater bot.*
          branch: "bot/yt-dlp-update-${{ steps.version_check.outputs.latest }}"
          delete-branch: true
