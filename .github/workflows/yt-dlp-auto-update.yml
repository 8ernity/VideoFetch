# ──────────────────────────────────────────────────────────────
# 🤖 yt-dlp Auto-Updater Bot
# Runs daily at 06:00 UTC. Checks PyPI for the latest yt-dlp
# release and opens a PR if a newer version is available.
# ──────────────────────────────────────────────────────────────

name: "🔄 yt-dlp Auto-Updater"

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Check latest yt-dlp version
        id: version_check
        run: |
          # Fetch latest yt-dlp version from PyPI
          LATEST=$(curl -sf https://pypi.org/pypi/yt-dlp/json | node -e "
            let d=''; process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              const info = JSON.parse(d);
              console.log(info.info.version);
            });
          ")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          # Read current pinned version (or 'none' if file doesn't exist)
          if [ -f .yt-dlp-version ]; then
            CURRENT=$(cat .yt-dlp-version | tr -d '[:space:]')
          else
            CURRENT="none"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          echo "📦 Latest yt-dlp: $LATEST"
          echo "📌 Current pin:   $CURRENT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create update branch & PR
        if: steps.version_check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.version_check.outputs.latest }}
          CURRENT: ${{ steps.version_check.outputs.current }}
        run: |
          BRANCH="bot/yt-dlp-update-${LATEST}"

          # Check if a PR for this version already exists
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "⏭️ PR #$EXISTING already exists for yt-dlp $LATEST — skipping."
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch
          git checkout -b "$BRANCH"

          # Update version pin file
          echo "$LATEST" > .yt-dlp-version

          # Commit and push
          git add .yt-dlp-version
          git commit -m "chore(deps): bump yt-dlp to ${LATEST}

Automated update from yt-dlp ${CURRENT} → ${LATEST}.
Release notes: https://github.com/yt-dlp/yt-dlp/releases/tag/${LATEST}"

          git push origin "$BRANCH"

          # Create Pull Request
          gh pr create \
            --title "⬆️ Bump yt-dlp to ${LATEST}" \
            --body "## 🤖 Automated yt-dlp Update

| | Version |
|---|---|
| **Current** | \`${CURRENT}\` |
| **Latest**  | \`${LATEST}\` |

### Why?
Video platforms (YouTube, PornHub, etc.) frequently change their extraction APIs. Keeping \`yt-dlp\` updated ensures VideoFetch continues to work reliably.

### What changed?
📋 [yt-dlp ${LATEST} Release Notes](https://github.com/yt-dlp/yt-dlp/releases/tag/${LATEST})

### Deployment
After merging, update the \`yt-dlp\` binary on your server:
\`\`\`bash
pip install -U yt-dlp
# or
yt-dlp -U
\`\`\`

---
*🤖 This PR was auto-generated by the [yt-dlp Auto-Updater](.github/workflows/yt-dlp-auto-update.yml) bot.*" \
            --label "dependencies,bot" \
            --head "$BRANCH" \
            --base "main" || echo "⚠️ PR creation returned non-zero (labels may not exist yet — that's OK)"
