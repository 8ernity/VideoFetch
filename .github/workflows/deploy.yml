# ──────────────────────────────────────────────────────────────
# 🚀 Automated Deploy Bot
# Deploys the full-stack app to Vercel on every push to main.
# ──────────────────────────────────────────────────────────────

name: "🚀 Deploy to Vercel"

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  # ── Step 1: Lint & Build Validation ───────────────────────
  validate:
    name: "✅ Validate Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          npm ci --prefix client 2>/dev/null || npm install --prefix client
          npm ci --prefix server 2>/dev/null || npm install --prefix server

      - name: Build client
        run: npm run build --prefix client

  # ── Step 2: Deploy to Vercel ──────────────────────────────
  deploy:
    name: "🚀 Deploy Production"
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(npx vercel --prod --token="${VERCEL_TOKEN}" --yes)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "🌐 Deployed successfully to: $DEPLOY_URL"
