# ──────────────────────────────────────────────────────────────
# 🚀 Automated Deploy Bot
# Deploys the full-stack app to Vercel on every push to main.
# ──────────────────────────────────────────────────────────────

name: "🚀 Deploy to Vercel"

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  # ── Step 1: Lint & Build Validation ───────────────────────
  validate:
    name: "✅ Validate Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci --prefix client 2>/dev/null || npm install --prefix client
          npm ci --prefix server 2>/dev/null || npm install --prefix server

      - name: Build client
        run: npm run build --prefix client

  # ── Step 2: Deploy to Vercel ──────────────────────────────
  deploy:
    name: "🚀 Deploy Production"
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
